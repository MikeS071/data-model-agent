name: Governance checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scope-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - run: python3 .governance/build-release.py
      - run: git diff --exit-code -- .governance/release.json
      - run: node --test .governance/tests/*.test.mjs
      - run: python3 -m unittest discover -s .governance/tests -p test_install.py
